[project]
name = "estimador-cag"
version = "1.0.0"
description = "Servicio FastAPI que genera estimaciones de software a partir de transcripciones de reunión, con arquitectura CAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "openai>=1.55",
    "anthropic>=0.40",
    "streamlit>=1.36",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
