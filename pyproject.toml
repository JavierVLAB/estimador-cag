[project]
name = "estimador-cag"
version = "1.0.0"
description = "Servicio FastAPI que genera estimaciones de software a partir de transcripciones de reunión, con arquitectura CAG."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "openai>=1.55",
    "anthropic>=0.40",
    "streamlit>=1.36",
    "httpx>=0.27",
    # FastAPI necesita esto para parsear multipart/form-data con UploadFile.
    # Antes llegaba solo de forma transitiva vía streamlit, lo que hacía
    # depender el endpoint de adjuntos de una dependencia indirecta.
    "python-multipart>=0.0.12",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
